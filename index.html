<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jyutping practice</title>
<style>
:root{color-scheme:light dark;--bg:#e9efea;--fg:#14231f;--mu:#586b64;--bd:#bccbc3;--card:#f6faf7;--ac:#17695a;--ok:#1f7a4c;--no:#b33a3a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a17;--fg:#e4eee9;--mu:#8fa39a;--bd:#2c3d37;--card:#17251f;--ac:#5fcfb5;--ok:#5fcf8f;--no:#ee8a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.layout{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);min-height:100vh}
main{padding:36px 20px 90px}
h1{font:400 34px/1.1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0 0 8px}
button{font:inherit;color:inherit}
.mu{color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;font-size:15px}
.link{background:none;border:0;padding:0;color:var(--mu);cursor:pointer}
.link:hover{color:var(--fg)}
.ins{color:var(--mu);font-size:15px;margin:0 0 14px}
.sent{font:400 26px/1.6 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin-bottom:24px}
.sent.big{font-size:40px}
.w{cursor:help;border-bottom:1px dotted var(--mu)}
.spk{background:none;border:1px solid var(--bd);border-radius:50%;width:34px;height:34px;margin-left:10px;cursor:pointer;font-size:15px;vertical-align:middle;line-height:1}
.spk:hover{border-color:var(--ac)}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px 22px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:28px}
.ans{min-height:58px;border-bottom:2px solid var(--bd);padding:4px 0 10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 14px;cursor:pointer;font:400 21px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.tile:hover{border-color:var(--ac)}
.opts{display:grid;gap:10px;margin-bottom:22px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;cursor:pointer;font-size:21px}
.opt:hover{border-color:var(--ac)}
.opt .sent{margin:0;font-size:21px;line-height:1.5}
.opt .sent.big{font-size:21px}
.ok,.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.no,.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.fb{margin:0 0 12px;font-weight:600}
.okt{color:var(--ok)}.not{color:var(--no)}
#tip{position:fixed;z-index:9;background:var(--fg);color:var(--bg);padding:7px 12px;border-radius:6px;font-size:16px;pointer-events:none;max-width:260px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#md{border-left:1px solid var(--bd);background:var(--card);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;min-width:0}
.mdbar{display:flex;gap:10px;padding:14px 24px;border-bottom:1px solid var(--bd)}
.mdbar select{flex:1;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}
.mdbar .btn{padding:8px 14px;font-size:15px}
#mdbody{flex:1;overflow:auto;padding:8px 44px 80px}
.pad{padding-top:20px}
.md{max-width:46rem;font:400 18px/1.75 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.25;font-weight:600;margin:1.7em 0 .5em}
.md h1{font-size:2em;margin-top:.9em}.md h2{font-size:1.5em}.md h3{font-size:1.2em}.md h4,.md h5,.md h6{font-size:1em}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md .tbl{margin:0 0 1em}
.md ul,.md ol{padding-left:1.5em}.md li>ul,.md li>ol{margin:.2em 0}
.md code{font:.85em ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:4px;padding:.1em .35em}
.md pre{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:14px;overflow:auto}
.md pre code{background:none;padding:0;font-size:15px;line-height:1.5}
.md blockquote{border-left:3px solid var(--ac);padding-left:16px;color:var(--mu)}
.md blockquote>:last-child{margin-bottom:0}
.md a{color:var(--ac)}.md img{max-width:100%}
.md hr{border:0;border-top:1px solid var(--bd);margin:2em 0}
.md .tbl{overflow-x:auto}
.md table{border-collapse:collapse;font:16px/1.5 system-ui,sans-serif}
.md th,.md td{border-bottom:1px solid var(--bd);padding:7px 16px 7px 0;text-align:left}
.md th{border-bottom-width:2px}
button.btn{display:inline-block}
.modes{display:grid;gap:10px}
.mode{display:flex!important;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px 20px}
.mode span{font-size:15px}
.inp{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.speed{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--mu);margin:20px 0 24px}
.speed input{flex:1;max-width:260px;accent-color:var(--ac)}
.log{display:grid;gap:10px;margin:0 0 14px}
.msg{padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);max-width:94%;line-height:1.55}
.msg.me{justify-self:end;background:var(--ac);border-color:var(--ac);color:var(--bg)}
.msg p{margin:0 0 .6em}.msg>:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:0 0 .6em;padding-left:1.3em}
.msg .tbl{overflow-x:auto}.msg th,.msg td{padding:2px 14px 2px 0;text-align:left}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--bd);padding:8px 0}
.sec{font:400 24px/1.2 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:34px 0 8px}
.row .inp{flex:1;margin:0;width:auto;min-width:0}
@media(max-width:900px){.layout{grid-template-columns:1fr}#md{height:auto;min-height:60vh;position:static;border-left:0;border-top:1px solid var(--bd)}#mdbody{padding:8px 20px 60px}.mdbar{padding:14px 20px}}
</style>
</head>
<body>
<div class="layout">
<main><div id="app"></div></main>
<aside id="md" aria-label="Markdown viewer">
<div class="mdbar">
<select id="mdsel" aria-label="Markdown file"><option value="">No .md files found</option></select>
<label class="btn">Open file…<input id="mdfile" type="file" accept=".md,.markdown,text/markdown" hidden></label>
</div>
<div id="mdbody"><p class="mu pad">Pick a Markdown file above.</p></div>
</aside>
</div>
<div id="tip" hidden></div>
<script>
const app=document.getElementById('app'),tip=document.getElementById('tip');
let levels=[],lvl=0,words=[],sents=[],dict={};
const rnd=a=>a[Math.random()*a.length|0];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n,not)=>shuf(a.filter(x=>x!==not)).slice(0,n);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

/* Speech: the optional "zh" field in each word is used only for the voice, never displayed */
function say(t,r=.85){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=r;
  const v=speechSynthesis.getVoices().find(v=>/zh[-_]HK|yue/i.test(v.lang));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
const zhOf=s=>{const t=s.jp.split(' ').map(x=>dict[x]?.zh);return t.every(Boolean)?t.join(''):s.jp};
const spk=t=>{const b=h('button','spk','🔊');b.type='button';b.title='Listen';b.setAttribute('aria-label','Listen');b.onclick=e=>{e.stopPropagation();say(t)};return b};

/* word elements: right-click shows + speaks the translation */
const jpW=(s,i,tag='span',c='w')=>{const t=s.jp.split(' ')[i],e=h(tag,c,t);e.dataset.tip=t+' = '+s.w[i];e.dataset.say=dict[t]?.zh||t;return e};
const enIdx=(s,tok)=>{
  const t=tok.toLowerCase().replace(/[^a-z]/g,'');
  const c=[t,...['s','es','ing','ed'].filter(x=>t.endsWith(x)&&t.length>x.length+1).map(x=>t.slice(0,-x.length))];
  return s.w.findIndex(g=>g.toLowerCase().split(/[\s\/]+/).some(x=>c.includes(x)));
};
const enW=(s,tok,tag='span',c='w')=>{
  const e=h(tag,c,tok),i=enIdx(s,tok);
  if(i<0)e.dataset.tip='no direct translation';
  else{const t=s.jp.split(' ')[i];e.dataset.tip=tok.replace(/[^\w]/g,'')+' = '+t;e.dataset.say=dict[t]?.zh||t}
  return e;
};
const wEl=(w,lang)=>{const e=h('span','w',lang==='jp'?w.jp:w.en);e.dataset.tip=w.jp+' = '+w.en;e.dataset.say=w.zh||w.jp;return e};
const sentEl=(s,lang)=>{
  const d=h('div','sent');
  (lang==='jp'?s.jp.split(' ').map((_,i)=>jpW(s,i)):s.en.split(' ').map(t=>enW(s,t))).forEach(e=>d.append(e,' '));
  d.append(spk(zhOf(s)));return d;
};
const wordP=(w,lang)=>{const d=h('div','sent big');d.append(wEl(w,lang),' ',spk(w.zh||w.jp));return d};

document.addEventListener('contextmenu',e=>{
  const t=e.target.closest('[data-tip]');if(!t)return;
  e.preventDefault();
  tip.textContent=t.dataset.tip;tip.hidden=false;
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(e.clientX,innerWidth-r.width-8))+'px';
  tip.style.top=Math.min(e.clientY+18,innerHeight-r.height-8)+'px';
  if(t.dataset.say)say(t.dataset.say);
});
['click','scroll','keydown'].forEach(ev=>addEventListener(ev,()=>tip.hidden=true,true));

/* layout helpers */
function shell(ins,tag){
  app.replaceChildren();
  const t=h('div','top'),b=h('button','link','← Levels');b.onclick=menu;
  t.append(b,h('span','mu',tag||'Level '+(lvl+1)));
  const c=h('div');app.append(t,h('p','ins',ins),c);return c;
}
function done(c,ok,s,lang){
  c.append(h('p','fb '+(ok?'okt':'not'),ok?'Correct':(s?'Not quite. The answer:':'Not quite')));
  if(s)c.append(sentEl(s,lang));
  const n=h('button','btn','Next →');n.onclick=next;c.append(n);n.focus();
}
function choose(ins,prompt,opts,ci){
  const c=shell(ins);c.append(prompt);
  const box=h('div','opts');let locked=false;
  opts.forEach((o,i)=>{
    const d=h('div','opt');d.append(o);
    d.onclick=()=>{if(locked)return;locked=true;d.classList.add(i===ci?'ok':'no');box.children[ci].classList.add('ok');done(c,i===ci)};
    box.append(d);
  });
  c.append(box);
}
function arrange(s,toJp){
  const c=shell(toJp?'Put the Jyutping in order':'Put the English in order');
  c.append(sentEl(s,toJp?'en':'jp'));
  const tok=(toJp?s.jp:s.en).split(' '),n=tok.length;
  const mk=i=>toJp?jpW(s,i,'button','tile'):enW(s,tok[i],'button','tile');
  let order=shuf([...Array(n).keys()]);
  while(n>1&&order.every((v,i)=>v===i))order=shuf(order);
  let placed=[],locked=false;
  const ans=h('div','ans'),pool=h('div','pool'),chk=h('button','btn','Check');
  const paint=()=>{
    ans.replaceChildren(...placed.map(i=>{const b=mk(i);b.onclick=()=>{if(!locked){placed=placed.filter(x=>x!==i);paint()}};return b}));
    pool.replaceChildren(...order.filter(i=>!placed.includes(i)).map(i=>{const b=mk(i);b.onclick=()=>{if(!locked){placed.push(i);paint()}};return b}));
    chk.disabled=placed.length<n;
  };
  chk.onclick=()=>{locked=true;chk.remove();const ok=placed.map(i=>tok[i]).join(' ')===tok.join(' ');ans.classList.add(ok?'ok':'no');done(c,ok,s,toJp?'jp':'en')};
  paint();c.append(ans,pool,chk);
}

/* the six exercises */
const ex=[
  ()=>arrange(rnd(sents),0),
  ()=>arrange(rnd(sents),1),
  ()=>{const s=rnd(sents),o=shuf([s,...pick(sents,3,s)]);choose('Choose the English translation',sentEl(s,'jp'),o.map(x=>sentEl(x,'en')),o.indexOf(s))},
  ()=>{const s=rnd(sents),o=shuf([s,...pick(sents,3,s)]);choose('Choose the Jyutping translation',sentEl(s,'en'),o.map(x=>sentEl(x,'jp')),o.indexOf(s))},
  ()=>{const w=rnd(words),o=shuf([w,...pick(words.filter(x=>x.en!==w.en),3,w)]);choose('Choose the English for this word',wordP(w,'jp'),o.map(x=>wEl(x,'en')),o.indexOf(w))},
  ()=>{const w=rnd(words),o=shuf([w,...pick(words.filter(x=>x.jp!==w.jp),3,w)]);choose('Choose the Jyutping for this word',wordP(w,'en'),o.map(x=>wEl(x,'jp')),o.indexOf(w))}
];
const next=()=>ex[Math.random()*ex.length|0]();

/* levels: level N uses the words and sentences of levels 1..N */
function load(i){
  lvl=i;words=[];sents=[];dict={};
  levels.slice(0,i+1).forEach((l,li)=>{
    (l.words||[]).forEach(w=>{if(!dict[w.jp]){w.lv=li;dict[w.jp]=w;words.push(w)}});
    sents.push(...(l.sentences||[]));
  });
}
function start(i){
  load(i);
  const c=shell('Choose how to practise'),g=h('div','modes');
  [['Exercises','Arrange and choose: six kinds of practice',next],['Listening','Hear a random sentence from your level and chat about it (uses Groq)',listen],['Dynamic listening','An adaptive benchmark across every level that ends with your tough spots (uses Groq)',dyn]].forEach(([t,d,f])=>{
    const b=h('button','btn mode');b.append(h('strong',null,t),h('span','mu',d));b.onclick=f;g.append(b);
  });
  c.append(g);
}
function menu(){
  app.replaceChildren(h('h1',null,'Jyutping practice'));
  if(!levels.length){
    app.append(h('p','mu','Could not load 1.json. Open this page through a local web server (for example, run “python3 -m http.server” in this folder, then visit localhost:8000/jyutping.html).'));
    return;
  }
  app.append(h('p','mu','Choose a level. Right-click any word to see and hear its translation.'));
  const g=h('div','grid');
  levels.forEach((_,i)=>{const b=h('button','btn','Level '+(i+1));b.onclick=()=>start(i);g.append(b)});
  const m=h('div','modes'),d=h('button','btn mode');
  d.append(h('strong',null,'Dynamic listening'),h('span','mu','An adaptive benchmark across every level'));d.onclick=dyn;m.append(d);m.style.marginTop='24px';
  app.append(g,m);
}
(async()=>{
  for(let n=1;;n++){
    try{const r=await fetch(n+'.json');if(!r.ok)break;levels.push(await r.json())}catch(e){break}
  }
  menu();
})();

/* ---------- Listening mode (Groq gpt-oss-120b) ---------- */
const LS='groqKey',seenL=[];let rate=.8;
const errMsg=e=>e instanceof TypeError?'Could not reach Groq. Check your connection':e.message;
async function ask(messages,temp){
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem(LS)},
    body:JSON.stringify({model:'openai/gpt-oss-120b',messages,temperature:temp,reasoning_effort:'low'})
  });
  if(r.status===401){localStorage.removeItem(LS);throw new Error('key')}
  if(!r.ok)throw new Error('Groq returned error '+r.status);
  return (await r.json()).choices[0].message.content||'';
}
async function groq(messages,temp){
  const m=(await ask(messages,temp)).match(/\{[\s\S]*\}/);
  try{return JSON.parse(m[0])}catch(e){throw new Error('Unreadable reply from Groq')}
}
function keyForm(msg,then){
  const c=shell('Enter your Groq API key');
  c.append(h('p','mu',msg||'Listening practice uses Groq. Get a key at console.groq.com/keys. It is saved only in this browser (localStorage).'));
  const i=h('input','inp'),b=h('button','btn','Save and continue');
  i.type='password';i.placeholder='gsk_…';i.autocomplete='off';
  const go=()=>{const v=i.value.trim();if(v){localStorage.setItem(LS,v);then()}};
  b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};
  c.append(i,b);i.focus();
}
function fail(c,e,retry){
  if(!c.isConnected)return;
  if(e.message==='key')return keyForm('That key was rejected. Enter a valid Groq API key.',retry);
  const b=h('button','btn','Try again');b.onclick=retry;
  c.replaceChildren(h('p','fb not',errMsg(e)),b);
}
const IDK='I don’t know';
const GRADER='You are a strict but fair Cantonese tutor marking a listening test for a beginner. The learner heard a Cantonese sentence and wrote what it means in English. Score 0 to 10 (10 = meaning fully correct; take off about 2 for each missing or wrong content word and 1 for small grammar slips; 0 if they gave no real answer). Be consistent from one sentence to the next. Reply with JSON only.';
/* random sentence straight from the JSON files, avoiding the last few shown */
function randSent(){
  const pool=sents.filter(x=>!seenL.includes(x)),x=rnd(pool.length?pool:sents);
  seenL.push(x);if(seenL.length>Math.min(8,sents.length-1))seenL.shift();
  return x;
}
function player(s){
  const lb=h('button','btn','🔊 Listen'),sp=h('input'),val=h('span',null,rate.toFixed(2)+'×'),lab=h('label','speed');
  lb.onclick=()=>say(zhOf(s),rate);
  sp.type='range';sp.min=.4;sp.max=1.2;sp.step=.05;sp.value=rate;
  sp.oninput=()=>{rate=+sp.value;val.textContent=rate.toFixed(2)+'×'};
  lab.append('Speed',sp,val);
  return[lb,lab];
}
function listen(){
  if(!localStorage.getItem(LS))return keyForm('',listen);
  const c=shell('Listen, then type what you heard in English'),s=randSent();
  const hist=[{role:'system',content:'You are a friendly Cantonese tutor chatting with a beginner. The learner just heard this Cantonese sentence read aloud and cannot see it: '+s.jp+' (Jyutping). Word for word: '+s.jp.split(' ').map((t,i)=>t+' = '+s.w[i]).join('; ')+'. Meaning: '+s.en+'. Their first message is their English answer. Start your reply with Yes or No (is their meaning right? accept synonyms and small grammar slips), then go through the sentence word for word with the Jyutping, saying what they got right or wrong. If they say they do not know, skip the verdict and explain the sentence: the meaning, then word for word. After that, answer their follow-up questions about this sentence or Cantonese in general. Keep replies short and simple, with no tables.'}];
  const log=h('div','log'),row=h('div','row'),inp=h('input','inp'),send=h('button','btn','Send'),err=h('p','fb not');
  const idk=h('button','btn',IDK),nx=h('button','btn','Next sentence →'),ck=h('button','link','Change API key'),acts=h('div','row');
  inp.type='text';inp.placeholder='Type what you heard, or ask a question';inp.autocomplete='off';
  let busy=false;
  const turn=async text=>{
    text=text.trim();if(busy||!text)return;
    busy=true;err.textContent='';inp.value='';
    const um=h('div','msg me',text),am=h('div','msg ai','…');
    log.append(um,am);am.scrollIntoView({block:'nearest'});
    hist.push({role:'user',content:text});
    try{
      const r=await ask(hist,.5);
      hist.push({role:'assistant',content:r});
      am.innerHTML=md(r.trim());
    }catch(e){
      hist.pop();um.remove();am.remove();inp.value=text;
      if(!c.isConnected){busy=false;return}
      if(e.message==='key')return keyForm('That key was rejected. Enter a valid Groq API key.',listen);
      err.textContent=errMsg(e)+'. Try again.';
    }
    busy=false;inp.focus();
  };
  send.onclick=()=>turn(inp.value);
  inp.onkeydown=e=>{if(e.key==='Enter')turn(inp.value)};
  idk.onclick=()=>turn(IDK+'. Please explain it to me.');
  nx.onclick=listen;
  ck.onclick=()=>keyForm('Enter a new Groq API key.',listen);
  row.append(inp,send);acts.append(idk,nx,ck);
  c.append(...player(s),log,err,row,h('p'),acts);inp.focus();
}

/* ---------- Dynamic listening: an adaptive benchmark ----------
   Two separate AI sessions: a generator that writes each sentence (told how you scored),
   and a grader that marks your answer out of 10. Pass = 6+. Each pass makes the next sentence
   harder (longer, with words from later levels); it stops after 3 misses in a row. */
const PASS=6,MISS_STOP=3,CAP=25;
function dyn(){load(levels.length-1);dynNext({d:0,fails:0,rec:[],gen:[],chat:[]})}
async function genDyn(st){
  const tier=Math.min(levels.length-1,st.d>>1),len=Math.min(10,2+(st.d>>1));
  const allowed=words.filter(w=>w.lv<=tier),newest=tier?words.filter(w=>w.lv===tier):[];
  const used=st.rec.map(r=>r.jp),last=st.rec[st.rec.length-1];
  const msg='Difficulty '+st.d+'. Allowed words (Jyutping with meaning): '+allowed.map(w=>w.jp+' ('+w.en+')').join(', ')+'.\nWrite one new natural, grammatical Cantonese sentence of about '+len+' words using ONLY the allowed words, each copied exactly in Jyutping'+(newest.length?', and include at least one of the newest words: '+newest.map(w=>w.jp).join(', '):'')+'.\n'+(last?'The learner scored '+last.score+'/10 on the previous sentence ('+last.jp+'). ':'')+'Already used: '+(used.join(' | ')||'none')+'.\nReply as {"jp":"words separated by single spaces","en":"natural English translation"}';
  for(let n=0;n<3;n++){
    const o=await groq([{role:'system',content:'You write sentences for an adaptive Cantonese listening benchmark that gets harder as the learner succeeds. Reply with JSON only.'},...st.gen.slice(-6),{role:'user',content:msg}],1);
    const t=String(o.jp||'').trim().toLowerCase().split(/\s+/),jp=t.join(' ');
    if(o.en&&t.length>1&&t.every(x=>dict[x]&&dict[x].lv<=tier)&&!used.includes(jp)){
      st.gen.push({role:'user',content:'Difficulty '+st.d+(last?', previous score '+last.score+'/10':'')},{role:'assistant',content:JSON.stringify({jp,en:o.en})});
      return{jp,en:String(o.en),w:t.map(x=>dict[x].en),d:st.d,tier:Math.max(...t.map(x=>dict[x].lv))};
    }
  }
  throw new Error('Could not get a valid sentence');
}
async function dynNext(st){
  if(st.fails>=MISS_STOP||st.rec.length>=CAP)return dynEnd(st);
  if(!localStorage.getItem(LS))return keyForm('',()=>dynNext(st));
  const c=shell('Listen, then write what it means in English','Benchmark');
  c.append(h('p','mu','Writing sentence '+(st.rec.length+1)+'…'));
  let s;
  try{s=await genDyn(st)}catch(e){return fail(c,e,()=>dynNext(st))}
  if(!c.isConnected)return;
  c.replaceChildren();
  const tok=s.jp.split(' '),inp=h('input','inp'),send=h('button','btn','Check'),idk=h('button','btn',IDK),end=h('button','link','End benchmark'),err=h('p','fb not'),acts=h('div','row');
  inp.type='text';inp.placeholder='What does it mean in English?';inp.autocomplete='off';
  let busy=false;
  const submit=async text=>{
    text=text.trim();if(busy||!text)return;
    busy=true;err.textContent='';inp.disabled=send.disabled=idk.disabled=true;send.textContent='Scoring…';
    const gmsg='Cantonese (Jyutping): '+s.jp+'\nWord for word: '+tok.map((t,i)=>t+' = '+s.w[i]).join('; ')+'\nIntended English: '+s.en+'\nLearner wrote: '+text+'\nReply as {"score":integer from 0 to 10,"feedback":"2 to 3 short sentences explaining the score, word for word where it helps","missed":["Jyutping words the learner got wrong or left out"]}';
    try{
      const g=await groq([{role:'system',content:GRADER},...st.chat.slice(-6),{role:'user',content:gmsg}],.2);
      const sc=Math.max(0,Math.min(10,Math.round(+g.score)));
      if(isNaN(sc))throw new Error('Unreadable score from Groq');
      const missed=text===IDK?tok:(Array.isArray(g.missed)?g.missed:[]).map(x=>String(x).toLowerCase().trim()).filter(x=>tok.includes(x));
      st.chat.push({role:'user',content:gmsg},{role:'assistant',content:JSON.stringify({score:sc,feedback:g.feedback,missed})});
      const r={jp:s.jp,en:s.en,w:s.w,a:text,score:sc,missed,fb:String(g.feedback||''),tier:s.tier};
      st.rec.push(r);
      if(sc>=PASS){st.fails=0;st.d++}else st.fails++;
      if(c.isConnected)dynResult(c,st,r,s);
      return;
    }catch(e){
      if(!c.isConnected)return;
      if(e.message==='key')return keyForm('That key was rejected. Enter a valid Groq API key.',()=>dynNext(st));
      inp.disabled=send.disabled=idk.disabled=false;send.textContent='Check';err.textContent=errMsg(e)+'. Try again.';
      busy=false;
    }
  };
  send.onclick=()=>submit(inp.value);idk.onclick=()=>submit(IDK);
  inp.onkeydown=e=>{if(e.key==='Enter')submit(inp.value)};
  end.onclick=()=>dynEnd(st);
  acts.append(send,idk,end);
  c.append(h('p','mu','Sentence '+(st.rec.length+1)+'. A pass is '+PASS+'/10 or more. The benchmark ends after '+MISS_STOP+' misses in a row ('+st.fails+' so far).'),...player(s),inp,err,acts);
  inp.focus();
}
function dynResult(c,st,r,s){
  c.replaceChildren();
  const stop=st.fails>=MISS_STOP||st.rec.length>=CAP,n=h('button','btn',stop?'See results →':'Next sentence →');
  n.onclick=()=>dynNext(st);
  c.append(h('p','sent big '+(r.score>=PASS?'okt':'not'),r.score+'/10'),h('p',null,r.fb),h('p','mu','You wrote: '+r.a),sentEl(s,'jp'),h('p','mu','Meaning: '+s.en),n);
  n.focus();
}
async function dynEnd(st){
  const c=shell('Benchmark results','Benchmark'),R=st.rec,again=h('button','btn','Run again');
  again.onclick=dyn;
  if(!R.length){c.append(h('p','mu','No sentences were scored.'),again);return}
  const avg=R.reduce((a,r)=>a+r.score,0)/R.length,ok=R.filter(r=>r.score>=PASS);
  const kv=(k,v)=>{const d=h('div','kv');d.append(h('span',null,k),h('strong',null,v));return d};
  c.append(
    h('p',null,st.fails>=MISS_STOP?'You missed '+MISS_STOP+' in a row, so the benchmark stopped there.':R.length>=CAP?'You completed all '+CAP+' sentences.':'You ended the benchmark early.'),
    kv('Average score',avg.toFixed(1)+' / 10'),
    kv('Sentences scored',String(R.length)),
    kv('Longest sentence passed',ok.length?Math.max(...ok.map(r=>r.jp.split(' ').length))+' words':'none'),
    kv('Furthest level passed',ok.length?'Level '+(Math.max(...ok.map(r=>r.tier))+1):'none'),
    h('h2','sec','By vocabulary level'),h('p','mu','A sentence counts under the highest level of any word in it.'));
  for(let t=0;t<levels.length;t++){
    const x=R.filter(r=>r.tier===t);
    if(x.length)c.append(kv('Level '+(t+1),(x.reduce((a,r)=>a+r.score,0)/x.length).toFixed(1)+' / 10 over '+x.length+' sentence'+(x.length>1?'s':'')));
  }
  const ws={};
  R.forEach(r=>r.jp.split(' ').forEach(t=>{const x=ws[t]||(ws[t]={seen:0,miss:0});x.seen++;if(r.missed.includes(t))x.miss++}));
  const tough=Object.entries(ws).filter(([,x])=>x.miss).sort((a,b)=>b[1].miss/b[1].seen-a[1].miss/a[1].seen||b[1].miss-a[1].miss).slice(0,12);
  c.append(h('h2','sec','Tough spots'));
  if(!tough.length)c.append(h('p','mu','No words were missed.'));
  tough.forEach(([t,x])=>{const d=h('div','kv'),l=h('span');l.append(wEl(dict[t],'jp'),' '+dict[t].en);d.append(l,h('span','mu','missed '+x.miss+' of '+x.seen));c.append(d)});
  const hard=[...R].sort((a,b)=>a.score-b.score).filter(r=>r.score<PASS).slice(0,3);
  if(hard.length){c.append(h('h2','sec','Sentences to revisit'));hard.forEach(r=>c.append(sentEl(r,'jp'),h('p','mu','Meaning: '+r.en+'. You wrote: '+r.a+' ('+r.score+'/10)')))}
  const adv=h('div','msg ai','Writing advice…');
  c.append(h('h2','sec','What to work on'),adv,h('p'),again);
  try{
    const r=await ask([{role:'system',content:'You are a friendly Cantonese tutor.'},{role:'user',content:'A learner just finished a listening benchmark. Average '+avg.toFixed(1)+'/10 over '+R.length+' sentences. Words they missed (Jyutping = meaning, missed of seen): '+(tough.map(([t,x])=>t+' = '+dict[t].en+', '+x.miss+' of '+x.seen).join('; ')||'none')+'. Sentences below the pass mark: '+(hard.map(r=>r.jp+' ('+r.en+') '+r.score+'/10').join('; ')||'none')+'. In 4 to 6 short sentences, tell them what to work on and how, in plain language.'}],.5);
    if(c.isConnected)adv.innerHTML=md(r.trim());
  }catch(e){adv.textContent='Advice unavailable: '+errMsg(e)}
}

/* ---------- Markdown side panel ---------- */
const mdSel=document.getElementById('mdsel'),mdBody=document.getElementById('mdbody'),picked={};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safe=u=>/^\s*(javascript|data|vbscript):/i.test(u)?'#':u;
function inl(s){
  const codes=[];
  s=esc(s).replace(/`([^`]+)`/g,(_,c)=>'\0'+(codes.push('<code>'+c+'</code>')-1)+'\0');
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(_,a,u)=>'<img alt="'+a+'" src="'+safe(u)+'">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,t,u)=>'<a href="'+safe(u)+'" target="_blank" rel="noopener">'+t+'</a>')
    .replace(/\*\*([^*]+)\*\*|__([^_]+)__/g,(_,a,b)=>'<strong>'+(a||b)+'</strong>')
    .replace(/\*([^*]+)\*|\b_([^_]+)_\b/g,(_,a,b)=>'<em>'+(a||b)+'</em>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>');
  return s.replace(/\0(\d+)\0/g,(_,i)=>codes[i]);
}
function md(src){
  const L=src.replace(/\r/g,'').split('\n'),out=[],li=/^\s*([-*+]|\d+\.)\s/;
  const hr=/^\s*([-*_]\s*){3,}$/,sep=/^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  let i=0,m;
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}
    if(m=l.match(/^(#{1,6})\s+(.*?)\s*#*$/)){out.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>');i++;continue}
    if(hr.test(l)){out.push('<hr>');i++;continue}
    if(/^>/.test(l)){const b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));out.push('<blockquote>'+md(b.join('\n'))+'</blockquote>');continue}
    if(l.includes('|')&&sep.test(L[i+1]||'')){
      const head=cells(l),rows=[];i+=2;
      while(i<L.length&&L[i].trim()&&L[i].includes('|'))rows.push(cells(L[i++]));
      out.push('<div class="tbl"><table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    if(li.test(l)){
      const base=l.match(/^\s*/)[0].length,tag=/^\s*\d/.test(l)?'ol':'ul',items=[];
      while(i<L.length){
        if(!L[i].trim()){let j=i;while(j<L.length&&!L[j].trim())j++;if(j<L.length&&li.test(L[j])&&L[j].match(/^\s*/)[0].length===base){i=j;continue}break}
        const ind=L[i].match(/^\s*/)[0].length,mm=L[i].match(/^\s*(?:[-*+]|\d+\.)\s+(.*)/);
        if(mm&&ind===base){items.push([mm[1]]);i++}
        else if(ind>base&&items.length){items[items.length-1].push(L[i].slice(base+2));i++}
        else break;
      }
      out.push('<'+tag+'>'+items.map(it=>'<li>'+inl(it[0])+(it.length>1?md(it.slice(1).join('\n')):'')+'</li>').join('')+'</'+tag+'>');
      continue;
    }
    const b=[l];i++;
    while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|>|```|\|)/.test(L[i])&&!li.test(L[i])&&!hr.test(L[i]))b.push(L[i++]);
    out.push('<p>'+inl(b.join(' '))+'</p>');
  }
  return out.join('\n');
}
async function openMd(name){
  if(!name){mdBody.innerHTML='<p class="mu pad">Pick a Markdown file above.</p>';return}
  try{
    const t=name in picked?picked[name]:await fetch(encodeURIComponent(name)).then(r=>{if(!r.ok)throw 0;return r.text()});
    mdBody.innerHTML='<div class="md">'+md(t)+'</div>';mdBody.scrollTop=0;
  }catch(e){mdBody.innerHTML='<p class="mu pad">Could not load '+esc(name)+'.</p>'}
}
/* A browser cannot list a folder itself, so read the server's directory listing,
   plus an optional md.json (["a.md","b.md"]) for servers that don't list folders. */
async function loadMdList(){
  const found=new Set(Object.keys(picked));
  try{
    const r=await fetch('./');
    if(r.ok)new DOMParser().parseFromString(await r.text(),'text/html').querySelectorAll('a[href]').forEach(a=>{
      const p=decodeURIComponent(a.getAttribute('href').split(/[?#]/)[0]).split('/').pop();
      if(/\.md$/i.test(p))found.add(p);
    });
  }catch(e){}
  try{const r=await fetch('md.json');if(r.ok)(await r.json()).forEach(f=>found.add(f))}catch(e){}
  const cur=mdSel.value,names=[...found].sort((a,b)=>a.localeCompare(b));
  mdSel.replaceChildren(new Option(names.length?'Choose a .md file':'No .md files found',''),...names.map(n=>new Option(n,n)));
  if(names.includes(cur))mdSel.value=cur;
  else if(names.length&&!cur){mdSel.value=names[0];openMd(names[0])}
}
mdSel.onchange=()=>openMd(mdSel.value);
document.getElementById('mdfile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  picked[f.name]=await f.text();e.target.value='';
  if(![...mdSel.options].some(o=>o.value===f.name))mdSel.append(new Option(f.name,f.name));
  mdSel.value=f.name;openMd(f.name);
};
addEventListener('focus',loadMdList);
loadMdList();
</script>
